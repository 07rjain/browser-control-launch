<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiet Routing — generative study</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <!-- Headers (CUSTOMIZE THIS FOR YOUR ART) -->
            <h1>Quiet Routing</h1>
            <div class="subtitle">Seeded browser paths: many intentions, one direction.</div>

            <!-- Seed Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" aria-label="Seed number" class="seed-input" value="1703" onchange="updateSeed()">
                <button class="button secondary" style="margin-bottom:8px" onclick="updateSeed()">Go to seed</button>
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section (CUSTOMIZE THIS FOR YOUR ART) -->
            <div class="control-section"><h3>Parameters</h3>
                <div class="control-group"><label for="strands">Strands per side</label><div class="slider-container"><input type="range" id="strands" min="6" max="30" step="1" value="19" oninput="updateParam('strands', this.value)"><span class="value-display" id="strands-value">19</span></div></div>
                <div class="control-group"><label for="spread">Route spacing</label><div class="slider-container"><input type="range" id="spread" min="0.4" max="1.5" step="0.1" value="1" oninput="updateParam('spread', this.value)"><span class="value-display" id="spread-value">1</span></div></div>
                <div class="control-group"><label for="curvature">Turn curvature</label><div class="slider-container"><input type="range" id="curvature" min="0.7" max="1.2" step="0.05" value="1" oninput="updateParam('curvature', this.value)"><span class="value-display" id="curvature-value">1</span></div></div>
            </div>
            <div class="control-section"><h3>Colors</h3>
                <div class="color-group"><label for="ink">Route ink</label><div class="color-picker-container"><input type="color" id="ink" value="#b65c9c" onchange="updateColor(this.value)"><span class="color-value" id="ink-value">#b65c9c</span></div></div>
            </div>
            <!-- Actions Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="initializeSystem()">Regenerate</button>
                </div>
                <button class="button tertiary" style="margin-top:8px" onclick="saveCanvas('quiet-routing-' + params.seed, 'png')">Download PNG</button>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
const routingDefaults = { seed: 1703, strands: 19, spread: 1, curvature: 1 };
/** A small, deterministic field. SVG and the p5 study share these control points. */
function quietRoutes(params = routingDefaults) {
    let state = params.seed >>> 0;
    const random = () => {
        state += 0x6D2B79F5;
        let t = state;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
    return [-1, 1].flatMap(side => Array.from({ length: params.strands }, (_, index) => {
        const offset = (index - (params.strands - 1) / 2) * 8 * params.spread;
        const jitter = (random() - .5) * 15;
        const bend = params.curvature * (1 + (random() - .5) * .12);
        const mirror = (x) => side === -1 ? x : 1440 - x;
        const points = [
            [-60, 83 + offset + jitter],
            [169 + offset * .5, 28 + offset],
            [262 * bend + offset * .2, 133 + offset],
            [208 + offset * .7, 263 + offset * .55],
            [147 / bend + offset * .8, 422 + offset * .4],
            [167 + offset, 523 + offset * .3],
            [341 + offset * .6, 622 + offset * .1],
        ].map(([x, y]) => [mirror(x), y]);
        const d = `M${points[0].join(',')} C${points.slice(1, 4).map(p => p.join(',')).join(' ')} C${points.slice(4).map(p => p.join(',')).join(' ')}`;
        return { d, points, index, side, emphasis: index % 6 === 0 };
    }));
}

        let params = { ...routingDefaults, ink: '#b65c9c' };
        const defaultParams = { ...params };
        let routes = [];
        let tick = 0;
        function setup() {
            const canvas = createCanvas(1440, 720);
            canvas.parent('canvas-container');
            pixelDensity(1);
            frameRate(30);
            document.querySelector('.loading').style.display = 'none';
            initializeSystem();
        }
        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            routes = quietRoutes(params);
            tick = 0;
            loop();
        }
        function draw() {
            background('#fdf7fd');
            const context = drawingContext;
            const progress = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 1 - Math.pow(1 - Math.min(1, tick / 75), 3);
            context.lineCap = 'round';
            for (const route of routes) {
                context.strokeStyle = params.ink;
                context.globalAlpha = route.emphasis ? .65 : .32;
                context.lineWidth = route.emphasis ? 1.4 : .85;
                context.setLineDash([1300 * progress, 2000]);
                context.stroke(new Path2D(route.d));
            }
            context.setLineDash([]);
            context.globalAlpha = 1;
            tick++;
            if (progress === 1) noLoop();
        }
        function updateParam(name, value) {
            params[name] = Number(value);
            document.getElementById(name + '-value').textContent = value;
            initializeSystem();
        }
        function updateColor(value) {
            params.ink = value;
            document.getElementById('ink-value').textContent = value;
            initializeSystem();
        }
        function updateSeedDisplay() { document.getElementById('seed-input').value = params.seed; }
        function updateSeed() {
            const value = Number(document.getElementById('seed-input').value);
            if (Number.isSafeInteger(value) && value > 0) { params.seed = value; initializeSystem(); }
            updateSeedDisplay();
        }
        function previousSeed() { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); initializeSystem(); }
        function nextSeed() { params.seed++; updateSeedDisplay(); initializeSystem(); }
        function randomSeedAndUpdate() { params.seed = Math.floor(Math.random() * 999999) + 1; updateSeedDisplay(); initializeSystem(); }
        function resetParameters() {
            params = { ...defaultParams };
            for (const key of ['strands', 'spread', 'curvature', 'ink']) {
                document.getElementById(key).value = params[key];
                document.getElementById(key + '-value').textContent = params[key];
            }
            updateSeedDisplay();
            initializeSystem();
        }
        window.addEventListener('load', updateSeedDisplay);
    </script>
</body>
</html>
